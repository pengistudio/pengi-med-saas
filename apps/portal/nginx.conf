server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Patients' medical data: never indexed, never framed, and the clinic slug
    # in the URL never leaks to other sites: the Referer carries only the origin
    # (Cloudflare Turnstile checks it against the widget's allowed domains).
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "strict-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        # add_header in a location drops the server-level ones: repeat them.
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Referrer-Policy "strict-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
