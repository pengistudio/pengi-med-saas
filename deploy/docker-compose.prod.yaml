services:
  caddy:
    image: caddy:2-alpine
    container_name: pengi-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app

  api:
    image: ghcr.io/pengistudio/pengi-api:latest
    container_name: pengi-api
    restart: unless-stopped
    env_file: .env.prod
    volumes:
      - api_storage:/app/storage
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - app

  web:
    image: ghcr.io/pengistudio/pengi-web:latest
    container_name: pengi-web
    restart: unless-stopped
    networks:
      - app

  backoffice:
    image: ghcr.io/pengistudio/pengi-backoffice:latest
    container_name: pengi-backoffice
    restart: unless-stopped
    networks:
      - app

  portal:
    image: ghcr.io/pengistudio/pengi-portal:latest
    container_name: pengi-portal
    restart: unless-stopped
    networks:
      - app

  landing:
    image: ghcr.io/pengistudio/pengi-landing:latest
    container_name: pengi-landing
    restart: unless-stopped
    networks:
      - app

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: pengi-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: pengi-gotenberg
    restart: unless-stopped
    # Tenants upload their own HTML templates, so Chromium must not fetch
    # anything but the document Gotenberg writes to /tmp and data: URIs (our
    # templates embed logo and QR as data:). Without this a template could
    # load http://api:8080, rabbitmq, etc. (SSRF). Keep in sync with
    # docker-compose.dev.yaml.
    command:
      - gotenberg
      - "--chromium-allow-list=^(file:///tmp/|data:)"
      - "--chromium-deny-private-ips"
      - "--chromium-disable-javascript"
    networks:
      - app

  icd-api:
    image: whoicd/icd-api
    container_name: pengi-icd-api
    restart: unless-stopped
    environment:
      - acceptLicense=true
      - saveAnalytics=false
      - include=2026-01_en-es
    networks:
      - app

  sri-xml-signer:
    image: ghcr.io/pengistudio/pengi-sri-xml-signer:latest
    container_name: pengi-sri-xml-signer
    restart: unless-stopped
    environment:
      - ALLOWED_ORIGIN=http://api:8080
    networks:
      - app

  # Monitoreo (ver DEPLOY.md §11). Ninguno de los dos es público: Prometheus
  # no publica puertos y Grafana solo escucha en 127.0.0.1 (túnel SSH).
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: pengi-prometheus
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.5
    # Solo el token, no todo .env.prod (DB, AUTH_KEY…). Vacío → target "down".
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    # Escribe el token a un archivo (fuera del repo y del volumen) para
    # `credentials_file` de prometheus.yml y arranca Prometheus. printf y no
    # sed: el token de base64 puede traer / + =.
    entrypoint:
      - /bin/sh
      - -c
      - |
        umask 077
        printf '%s' "$${METRICS_TOKEN}" > /tmp/metrics_token
        exec /bin/prometheus \
          --config.file=/etc/prometheus/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --storage.tsdb.retention.time=15d \
          --storage.tsdb.retention.size=1GB
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - app

  grafana:
    image: grafana/grafana:12.2.0
    container_name: pengi-grafana
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Solo se aplica al crear grafana.db (primer arranque); ver DEPLOY.md.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD es obligatoria en .env.prod}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - app

volumes:
  caddy_data:
  caddy_config:
  api_storage:
  rabbitmq_data:
  prometheus_data:
  grafana_data:

networks:
  app:
    driver: bridge
