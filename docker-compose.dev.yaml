services:
  api:
    build:
      context: apps/api
      dockerfile: Dockerfile.dev
    container_name: pengi-api
    ports:
      - "8000:8080"
    environment:
      - GIN_MODE=debug
      # Dev-only key for patient attachments at rest; never use it elsewhere.
      # Overridable from the shell or the root .env.
      - ATTACHMENT_ENCRYPTION_KEY=${ATTACHMENT_ENCRYPTION_KEY:-XUTNglm0vHTCuwFJpJAFVX5ymyn7Kq7RyGTnDhKslc0=}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - ./apps/api/.env
    volumes:
      - ./apps/api:/app
      - ./storage:/app/storage
    networks:
      - gentoo_network

  db:
    image: postgres:15-alpine
    container_name: pengi-db-dev
    restart: on-failure
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pengi_gentoo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gentoo_network

  icd-api:
    image: whoicd/icd-api
    container_name: icd-api
    restart: on-failure
    environment:
      - acceptLicense=true
      - saveAnalytics=false
      - include=2026-01_en-es
    ports:
      - "8091:80"
    networks:
      - gentoo_network

  gotenberg:
    container_name: gotenberg-gentoo
    image: gotenberg/gotenberg:8
    restart: on-failure
    # Tenants upload their own HTML templates, so Chromium must not fetch
    # anything but the document Gotenberg writes to /tmp and data: URIs (our
    # templates embed logo and QR as data:). Without this a template could
    # load http://api:8080, rabbitmq, etc. (SSRF). Keep in sync with
    # deploy/docker-compose.prod.yaml.
    command:
      - gotenberg
      - "--chromium-allow-list=^(file:///tmp/|data:)"
      - "--chromium-deny-private-ips"
      - "--chromium-disable-javascript"
    ports:
      - "8001:3000"
    networks:
      - gentoo_network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: pengi-rabbitmq-dev
    restart: on-failure
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gentoo_network

  sri-xml-signer:
    image: node:24-alpine
    container_name: sri-xml-signer
    working_dir: /app
    ports:
      - "9000:9000"
    environment:
      - PNPM_HOME=/pnpm/store
      - ALLOWED_ORIGIN=http://pengi-api:8080
      - CI=true
    volumes:
      - ./apps/sri-xml-signer:/app
      - pnpm_store_sri:/pnpm/store
    command: sh -c "corepack enable && pnpm install && pnpm run dev"
    networks:
      - gentoo_network

  # Installs the pnpm workspace (web, backoffice, packages/*) once. web and
  # backoffice share the bind-mounted node_modules, so installing from both
  # concurrently races on the same files (ENOENT on chmod of bins).
  workspace-deps:
    image: node:24-alpine
    container_name: pengi-workspace-deps
    working_dir: /workspace
    environment:
      - CI=true
      - PNPM_HOME=/pnpm/store
    volumes:
      - ./:/workspace
      - pnpm_store_workspace:/pnpm/store
    command: sh -c "corepack enable && pnpm install"

  web:
    image: node:24-alpine
    container_name: pengi-web-dev
    working_dir: /workspace/apps/web
    ports:
      - "3000:5173"
    environment:
      - CI=true
      - PNPM_HOME=/pnpm/store
    volumes:
      - ./:/workspace
      - pnpm_store_workspace:/pnpm/store
    depends_on:
      workspace-deps:
        condition: service_completed_successfully
    command: sh -c "corepack enable && pnpm run dev --host"
    networks:
      - gentoo_network

  backoffice:
    image: node:24-alpine
    container_name: pengi-backoffice-dev
    working_dir: /workspace/apps/backoffice
    ports:
      - "3001:5173"
    environment:
      - CI=true
      - PNPM_HOME=/pnpm/store
    volumes:
      - ./:/workspace
      - pnpm_store_workspace:/pnpm/store
    depends_on:
      workspace-deps:
        condition: service_completed_successfully
    command: sh -c "corepack enable && pnpm run dev --host"
    networks:
      - gentoo_network

  landing:
    image: node:24-alpine
    container_name: pengi-landing-dev
    working_dir: /app
    ports:
      - "3002:4321"
    environment:
      - CI=true
      - PNPM_HOME=/pnpm/store
    volumes:
      - ./apps/landing:/app
      - pnpm_store_landing:/pnpm/store
    command: sh -c "corepack enable && pnpm install && pnpm run dev --host"
    networks:
      - gentoo_network

  # Public HTTPS URL for the API so Meta can reach the WhatsApp webhook
  # (https://$NGROK_DOMAIN/api/v1/webhooks/whatsapp). Opt-in: set
  # COMPOSE_PROFILES=tunnel, NGROK_AUTHTOKEN and NGROK_DOMAIN (your free static
  # ngrok domain, so the URL never changes) in the root .env. Requests
  # inspector at http://localhost:4040.
  tunnel:
    image: ngrok/ngrok:3-alpine
    container_name: pengi-tunnel
    profiles: ["tunnel"]
    restart: unless-stopped
    command: ["http", "--url=${NGROK_DOMAIN:-}", "api:8080"]
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN:-}
    ports:
      - "4040:4040"
    depends_on:
      - api
    networks:
      - gentoo_network

volumes:
  postgres_data:
  pnpm_store_workspace:
  pnpm_store_sri:
  pnpm_store_landing:

networks:
  gentoo_network:
    driver: bridge