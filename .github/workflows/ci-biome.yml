name: "CI - Biome"
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  format-and-lint:
    name: "Biome (format + lint)"
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Código
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: "Ejecutar Biome en Aplicaciones Frontend"
        run: npx @biomejs/biome@2.6.3 ci ./apps/web ./apps/backoffice ./apps/portal ./packages/ui ./packages/shared

      # Lo que leen las apps y lo que documentan .env.example /
      # deploy/.env.prod.example tiene que coincidir.
      - name: "Verificar variables de entorno"
        run: node scripts/check-env.mjs

  typecheck:
    name: "TypeScript y tests (frontend)"
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Código
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: TypeScript check (web)
        run: pnpm --filter web typecheck

      - name: TypeScript check (backoffice)
        run: pnpm --filter backoffice typecheck

      - name: TypeScript check (portal)
        run: pnpm --filter portal typecheck

      - name: TypeScript check (@pengi/shared)
        run: pnpm --filter @pengi/shared typecheck

      - name: Tests (web)
        run: pnpm --filter web test:run

      - name: Tests (backoffice)
        run: pnpm --filter backoffice test:run

      - name: Tests (portal)
        run: pnpm --filter portal test:run

      - name: Tests (@pengi/shared)
        run: pnpm --filter @pengi/shared test:run

  backend-go:
    name: "Validar Código Backend (Go)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/api
    steps:
      - name: Descargar Código
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache-dependency-path: apps/api/go.sum

      - name: Descargar Dependencias
        run: go mod download

      - name: Análisis Estático (go vet)
        run: go vet ./...

      - name: Ejecutar Pruebas
        run: go test ./...

      - name: Verificar Compilación
        run: go build -v ./...

  sri-xml-signer:
    name: "Test SRI XML Signer"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/sri-xml-signer
    steps:
      - name: Descargar Código
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Instalar xmlsec1
        run: sudo apt-get update && sudo apt-get install -y xmlsec1

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Ejecutar tests
        run: pnpm test
