name: "CI - Biome"
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  format-and-lint:
    name: "Biome (format + lint)"
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: "Ejecutar Biome en Aplicaciones Frontend"
        run: npx @biomejs/biome ci ./apps/web ./apps/backoffice ./packages/ui

  typecheck:
    name: "TypeScript (web + backoffice)"
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: TypeScript check (web)
        run: pnpm --filter web typecheck

      - name: TypeScript check (backoffice)
        run: pnpm --filter backoffice typecheck

  backend-go:
    name: "Validar Código Backend (Go)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/api
    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache-dependency-path: apps/api/go.sum

      - name: Descargar Dependencias
        run: go mod download

      - name: Ejecutar Pruebas
        run: go test ./...

      - name: Verificar Compilación
        run: go build -v ./...

  sri-xml-signer:
    name: "Test SRI XML Signer"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/sri-xml-signer
    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Instalar xmlsec1
        run: sudo apt-get update && sudo apt-get install -y xmlsec1

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Ejecutar tests
        run: pnpm test
